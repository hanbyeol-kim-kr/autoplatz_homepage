class Component extends DCLogic {
constructor(props) {

let pick = '안양';

this.state = { center: pick };
}
renderVals() {
// 출처: 폭스바겐코리아 서비스센터 찾기 + 사내 지점 주소표 (2026년 11월 확인)

{ key: '안양', zip: '12602', addr: '경기도 안양시 동안구 벌말로102번길 54', tel: '031-360-0801', lunch: true,

{ key: '판교', zip: '12606', addr: '경기도 성남시 분당구 대왕판교로 283', tel: '031-696-0177', lunch: true,

{ key: '원주', zip: '33601', addr: '강원도 원주시 북원여중길 2 (태장동 1365)', tel: '033-737-6555', lunch: false,
services: ['일반수리', '사고수리', 'EV수리(배터리수리 제외)'], showroom: '원주 전시장' },
{ key: '대전', zip: '34604', addr: '대전광역시 대덕구 대덕대로1409번길 1', tel: '042-867-8282', lunch: true,
services: ['일반수리', '사고수리', 'EV수리'], showroom: '' },
{ key: '천안', zip: '34605', addr: '충청남도 천안시 서북구 한들1로 120', tel: '041-571-9994', lunch: true,
services: ['일반수리', 'EV수리(배터리수리 제외)'], showroom: '천안 전시장' },
{ key: '청주', zip: '34606', addr: '충청북도 청주시 흥덕구 신성로 6-16', tel: '043-223-0744', lunch: true,
services: ['일반수리', 'EV수리(배터리수리 제외)'], showroom: '' }
];
const telHref = (t) => 'tel:' + t.replace(/[^0-9]/g, '');
const chipBase = 'display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; font-size: 13px; font-family: inherit; cursor: pointer; border: 1px solid ';
const sel = CENTERS.find((c) => c.key === this.state.center) || CENTERS[1];
const centers = CENTERS.map((c) => ({
title: c.key + ' 서비스센터',
addr: c.addr,
tel: c.tel,
telHref: telHref(c.tel),
pressed: c.key === sel.key ? 'true' : 'false',
chip: c.key === sel.key ? chipBase + '#141414; background: #141414; color: #FFFFFF;' : chipBase + '#D6D6D6; background: #FFFFFF; color: #000000;',

}));
const mapQ = (a) => { const m = a.match(/^(.*(?:로|길)\s?\d+(?:-\d+)?)/); return encodeURIComponent(m ? m[1] : a); };
const cur = {
naverHref: 'https://map.naver.com/p/search/' + mapQ(sel.addr),
kakaoHref: 'https://map.kakao.com/link/search/' + mapQ(sel.addr),
title: sel.key + ' 서비스센터',
zip: sel.zip,
addr: sel.addr,
tel: sel.tel,
telHref: telHref(sel.tel),
hasLunch: sel.lunch,
services: sel.services.map((s) => ({ label: s })),
hasShowroom: !!sel.showroom,
showroom: sel.showroom,
goShowroom: () => { try { sessionStorage.setItem('ap_branch', sel.key); } catch (e) {} }
};
return { centers: centers, cur: cur };
}
}
