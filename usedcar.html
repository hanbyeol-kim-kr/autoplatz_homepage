<h1 style="margin: 20px 0 0; font-size: 44px; font-weight: 300; line-height: 1.1; color: #001E50;">{{cur.title}}</h1>

</sc-for>

<section aria-label="지점 정보" style="max-width: 1500px; margin: 0 auto; padding: 40px 24px 0; display: flex; flex-wrap: wrap; gap: 24px;">

<div style="display: flex; flex-direction: column; gap: 6px;">

</sc-for>
</div>
</div>

<section aria-label="폭스바겐 공식 인증 중고차 혜택" style="max-width: 1500px; margin: 0 auto; padding: 110px 24px 0;">
<h2 style="margin: 0; font-size: 34px; font-weight: 700;">폭스바겐 공식 인증 중고차 혜택</h2>
<p style="margin: 14px 0 40px; font-size: 15px; color: #000000; line-height: 1.7;">폭스바겐 공식 인증 중고차는 시간이 흘러도 변함없는 폭스바겐의 가치를 두 번째 고객에게 전합니다.</p>
<div style="display: flex; flex-direction: column; gap: 24px;">
<div style="background: #F8F8F8; display: flex; flex-wrap: wrap;">
<img src="assets/fa8b0f500de95bfba106f1e8a7f4693f.jpg" alt="폭스바겐 공인 테크니션의 차량 하부 점검" class="m-img" style="flex: 1 1 560px; min-width: 0; width: 100%; height: 400px; object-fit: cover; display: block;">
<div class="m-pad" style="flex: 1 1 440px; box-sizing: border-box; padding: 48px 56px; display: flex; flex-direction: column; justify-content: center; gap: 14px;">
<span style="font-size: 14px; font-weight: 700; color: #001E50;">Technical quality check</span>
<h3 style="margin: 0; font-size: 30px; font-weight: 300; line-height: 1.1; color: #001E50;">88가지 품질 점검</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.7; color: #000000;">폭스바겐 공인 테크니션이 기본 · 실내 · 진단기 · 등화류 · 엔진룸 · 소모품 · 시운전 · 리프트 점검까지 88가지 항목을 꼼꼼하게 점검합니다. 고객님이 직접 확인할 수 있도록 점검 내역도 제공해 드립니다.</p>
<div style="margin-top: 10px;"><button type="button" onClick="{{toggleCheck}}" aria-expanded="{{checkExpanded}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 22px; border: 1px solid #001E50; background: #FFFFFF; color: #001E50; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">{{checkLabel}}</button></div>
</div>
</div>
<sc-if value="{{openCheck}}" hint-placeholder-val="{{ false }}">
<div class="m-pad" style="background: #FFFFFF; border: 1px solid #DBE0E4; padding: 48px 56px;">
<h4 style="margin: 0; font-size: 24px; font-weight: 300; line-height: 1.1; color: #001E50;">Multi-Point Check List</h4>
<p style="margin: 14px 0 32px; font-size: 15px; line-height: 1.7;">폭스바겐 공인 테크니션이 88가지 항목을 점검해 품질을 유지하며, 고객님께 점검 내역을 제공해 드립니다.</p>
<div style="columns: 3 300px; column-gap: 48px;">
<div style="break-inside: avoid; margin-bottom: 32px;">
<h4 style="margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid #BFCAD0; font-size: 16px; font-weight: 700; color: #001E50;">01. 기본 점검</h4>
<ol style="margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.7;"><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">1</span><span>차량 등록증과 차대 번호 일치 여부</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">2</span><span>DMS에 규정된 정기 점검 정비 이력</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">3</span><span>차량 구조적 손상 또는 침수 여부</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">4</span><span>리콜 · 무상수리 실시 여부</span></li></ol>
</div>
<div style="break-inside: avoid; margin-bottom: 32px;">
<h4 style="margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid #BFCAD0; font-size: 16px; font-weight: 700; color: #001E50;">02. 실내 점검</h4>
<ol style="margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.7;"><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">5</span><span>스티어링 휠 컨트롤 버튼</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">6</span><span>경적 작동</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">7</span><span>계기판 조명 및 디스플레이(조명 조절기 포함)</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">8</span><span>시계 · 트립 컴퓨터</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">9</span><span>도어등 · 실내등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">10</span><span>앞좌석 시트 작동 및 메모리 기능</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">11</span><span>안전벨트 작동 및 상태</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">12</span><span>사이드 미러 작동 및 메모리</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">13</span><span>선루프 작동</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">14</span><span>글로브 박스 작동 및 조명</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">15</span><span>사용자 설명서 · 서비스 플랜 · 보증서 보유</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">16</span><span>실내 안전 라벨 부착 및 손상</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">17</span><span>페달 고무 찢어짐 · 마모</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">18</span><span>엔터테인먼트(CD · 튜너 · 미디어 · 블루투스)</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">19</span><span>스티어링 휠 조정 및 작동</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">20</span><span>중앙 잠금 장치</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">21</span><span>배터리 상태</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">22</span><span>에어컨 작동 및 냉각 성능(냉매량)</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">23</span><span>히터 작동 및 소음</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">24</span><span>실내 트림 · 대시보드 · 핸들 · 팔걸이 손상</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">25</span><span>카펫 · 플로어 매트 손상(트렁크 포함)</span></li></ol>
</div>
<div style="break-inside: avoid; margin-bottom: 32px;">
<h4 style="margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid #BFCAD0; font-size: 16px; font-weight: 700; color: #001E50;">03. 진단기 점검</h4>
<ol style="margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.7;"><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">26</span><span>진단기 온라인 프로토콜 점검(고장 코드)</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">27</span><span>엔진 · 변속기 최신 소프트웨어 업데이트</span></li></ol>
</div>
<div style="break-inside: avoid; margin-bottom: 32px;">
<h4 style="margin: 0 0 10px; padding-bottom: 10px; border-bottom: 1px solid #BFCAD0; font-size: 16px; font-weight: 700; color: #001E50;">04. 등화류 점검</h4>
<ol style="margin: 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.7;"><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">28</span><span>전조등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">29</span><span>상향등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">30</span><span>앞뒤 안개등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">31</span><span>주간 주행등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">32</span><span>앞뒤 방향지시등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">33</span><span>비상점멸표시등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">34</span><span>번호판등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">35</span><span>후미등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">36</span><span>제동등</span></li><li style="display: flex; gap: 10px; padding: 6px 0;"><span style="flex: 0 0 24px; color: #6D7A80;">37</span><span>후진등</span></li></ol>
</div>

<script src="dc-lite.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { branch: 'Approved 판교', check: false, finance: false };
}
renderVals() {
// 영업사원 명단: 2026년 11월 조직도 기준 (지점장·미화·리셉·관리·주차 제외)
// 휴대폰 번호는 mobile 칸에 입력하면 카드에 표시되고 전화하기 버튼이 해당 번호로 연결됩니다.
const BRANCHES = [
{ key: 'Approved 판교', photo: 'assets/31dbaa1eb16583cadc3f7fbc71b97497.jpg', zip: '12607', addr: '경기도 성남시 분당구 대왕판교로 283', tel: '031-726-7260', hours: '월~일 09:00 ~ 20:00',
intro: '88가지 품질 점검을 거친 폭스바겐 공식 인증 중고차 전시장입니다. 신차 전시장 · 서비스센터와 같은 건물에 있습니다.',
facilities: ['인증 중고차', '신차 전시장', '서비스센터', '부품'], svcName: '판교 서비스센터 (같은 건물)', svcTel: '031-696-0177',
teams: [
{ name: '인증 중고차팀', members: [
{ name: '박준영', role: '차장', mobile: '010-7119-7800', email: 'junyoung.park@vwautoplatz.co.kr', photo: 'assets/2c63a8d24f1e4a63c82cf47cd20c59dc.jpg' }
] }
] }
];
const telHref = (t) => 'tel:' + t.replace(/[^0-9]/g, '');
const chipBase = 'display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; font-size: 13px; font-family: inherit; cursor: pointer; border: 1px solid ';
const selected = BRANCHES[0];
const branches = BRANCHES.map((b) => ({
title: b.key + ' 전시장',
pressed: b.key === selected.key ? 'true' : 'false',
chip: b.key === selected.key ? chipBase + '#141414; background: #141414; color: #FFFFFF;' : chipBase + '#D6D6D6; background: #FFFFFF; color: #000000;',
pick: () => this.setState({ branch: b.key })
}));
const mapQ = (a) => { const m = a.match(/^(.*(?:로|길)\s?\d+(?:-\d+)?)/); return encodeURIComponent(m ? m[1] : a); };
const cur = {
naverHref: 'https://map.naver.com/p/search/' + mapQ(selected.addr),
kakaoHref: 'https://map.kakao.com/link/search/' + mapQ(selected.addr),
title: selected.key + ' 전시장',
intro: selected.intro,
hours: selected.hours,
photo: selected.photo || '',
hasPhoto: !!selected.photo,
noPhoto: !selected.photo,
zip: selected.zip,
addr: selected.addr,
tel: selected.tel,
telHref: telHref(selected.tel),
svcName: selected.svcName,
svcTel: selected.svcTel,
svcTelHref: telHref(selected.svcTel),
facilities: selected.facilities.map((f) => ({ label: f })),
teams: selected.teams.map((t) => ({
name: t.name,
count: t.members.length,
members: t.members.map((s) => {
const has = !!s.mobile;
return {
name: s.name,
role: s.role,
phoneText: has ? s.mobile : '[휴대폰 번호]',
phoneColor: has ? '#141414' : '#767676',
callHref: telHref(selected.tel),
callLabel: '전시장으로 전화하기',
mobileHref: has ? telHref(s.mobile) : null,
email: s.email || '',
hasEmail: !!s.email,
mailHref: s.email ? 'mailto:' + s.email : null,
photo: s.photo || '',
hasPhoto: !!s.photo,
noPhoto: !s.photo
};
})
}))
};
return {
branches: branches, cur: cur,
openCheck: this.state.check, checkExpanded: this.state.check ? 'true' : 'false', checkLabel: this.state.check ? '닫기 −' : '자세히 보기 +',
toggleCheck: () => this.setState({ check: !this.state.check }),
openFinance: this.state.finance, financeExpanded: this.state.finance ? 'true' : 'false', financeLabel: this.state.finance ? '닫기 −' : '자세히 보기 +',
toggleFinance: () => this.setState({ finance: !this.state.finance })
};
}
}

DC.mount(Component);
</script>
