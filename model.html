['시승은 어떻게 신청하나요?', '가까운 아우토플라츠 전시장에 전화로 문의하시면 담당 영업사원이 시승 일정을 안내해 드립니다. 시승 차량 운영 여부는 전시장마다 다를 수 있습니다.'],
['견적과 구매 조건은 어디서 확인하나요?', '리플렛(PDF)에서 트림별 가격을 확인하실 수 있으며, 할인·금융 조건 등 상세 견적은 전시장 영업사원에게 문의해 주세요.'],
['원하는 컬러와 트림의 재고가 있나요?', '재고는 수시로 바뀌므로 전시장으로 문의해 주시면 가장 빠르게 확인해 드립니다.'],
['구매 후 정비는 어디서 받나요?', '아우토플라츠는 수도권·강원·충청권에 7개 서비스센터를 운영하고 있으며, 모든 정비는 예약제로 진행됩니다. 서비스센터 안내 페이지에서 가까운 센터를 확인해 주세요.']
];
const faq = FAQ.map((f, i) => ({ q: f[0], a: f[1], open: this.state.faq === i, expanded: this.state.faq === i ? 'true' : 'false', icon: this.state.faq === i ? '−' : '+', toggle: () => this.setState({ faq: this.state.faq === i ? -1 : i }) }));
const m = {
name: sel.name, ko: sel.ko, type: sel.type, topline: sel.topline, price: won(sel.from),
hero: sel.hero, ext: sel.ext, int: sel.int, leaflet: sel.leaflet,
headline: sel.headline, intro: sel.intro,
facts: sel.facts.map((f) => ({ value: f[0], label: f[1] })),
extTitle: sel.extTitle, extText: sel.extText, intTitle: sel.intTitle, intText: sel.intText,
highlights: sel.highlights.map((h) => ({ label: h })),
trims: sel.trims.map((t) => ({ name: t[0], price: won(t[1]), eff: t[2] ? '복합 ' + t[2] : '' })),
note: sel.note, hasNote: !!sel.note
};
const showrooms = SHOWROOMS.map((s) => ({ name: s[0], addr: s[1], tel: s[2], telHref: telHref(s[2]), go: () => { try { sessionStorage.setItem('ap_branch', s[0].split(' ')[0]); } catch (e) {} } }));
return { m: m, tabs: tabs, faq: faq, showrooms: showrooms };
}
}

DC.mount(Component);
</script>
